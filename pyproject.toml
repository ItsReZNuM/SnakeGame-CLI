[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snakegame-cli"
version = "0.1.0"
description = "A polished, retro Nokia-inspired Snake game for your terminal powered by Rich."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "SnakeGame Team" }
]
keywords = [
    "snake",
    "game",
    "cli",
    "terminal",
    "rich",
    "nokia",
    "retro",
    "arcade"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
]

[project.scripts]
snakegame = "snakegame.cli:main"

[project.urls]
Homepage = "https://github.com/example/snakegame-cli"
Repository = "https://github.com/example/snakegame-cli"
"Bug Tracker" = "https://github.com/example/snakegame-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
